# Test environment: Oracle Free 23c. See xe-21/docker-compose.yaml for notes.
services:
  oracle:
    image: gvenzl/oracle-free:23.5-slim-faststart
    container_name: oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: olr_test
      APP_USER_PASSWORD: olr_test
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s
