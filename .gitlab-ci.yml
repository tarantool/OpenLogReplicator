stages:
  - build-olr

trigger docker dev build:
  stage: build-olr
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "1.9.0"'
      when: always
  trigger:
    project: tarantool/cdc/v9/openlogreplicator-docker-vk
    strategy: depend
    branch: vk
  variables:
    OLR_BRANCH: ${CI_COMMIT_REF_NAME}
    BUILD_TYPE: dev

trigger docker prod build:
  stage: build-olr
  rules:
    - if: '$CI_COMMIT_BRANCH == "1.9.0" && $CI_PIPELINE_SOURCE == "push"'
      when: always
  trigger:
    project: tarantool/cdc/v9/openlogreplicator-docker-vk
    strategy: depend
    branch: vk
  variables:
    OLR_BRANCH: ${CI_COMMIT_REF_NAME}
    BUILD_TYPE: prod
