stages:
  - build-and-test
  - release

# ----------------------------------------------------------------------------
# Dev image build + unit/regression tests run downstream in openlogreplicator-docker-vk
# (this project has no runners of its own; unit tests run inside the built dev image).
# ----------------------------------------------------------------------------
trigger docker dev with tests:
  stage: build-and-test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - tests/**/*
        - CMakeLists.txt
        - cmake/**/*
        - Makefile
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - src/**/*
        - tests/**/*
        - CMakeLists.txt
        - cmake/**/*
        - Makefile
  trigger:
    project: tarantool/cdc/v9/openlogreplicator-docker-vk
    strategy: depend
    branch: vk
  variables:
    OLR_BRANCH: ${CI_COMMIT_REF_NAME}
    BUILD_TYPE: dev

# ----------------------------------------------------------------------------
# Release image build on version tag — separate flow, no tests gating
# ----------------------------------------------------------------------------
trigger docker prod build:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: always
  trigger:
    project: tarantool/cdc/v9/openlogreplicator-docker-vk
    strategy: depend
    branch: vk
  variables:
    OLR_BRANCH: ${CI_COMMIT_REF_NAME}
    BUILD_TYPE: prod
